<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAVE SHIELD // Intercept Monitor</title>
<style>
:root{--bg:#02060a;--panel:#061219;--line:#0e3a46;--cy:#00f0ff;--mg:#ff2bd6;--gr:#39ff88;--am:#ffb800;--rd:#ff3355;--tx:#9fdde6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}
body{padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;
background-image:linear-gradient(rgba(0,240,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.04) 1px,transparent 1px);background-size:24px 24px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
h1{font-size:14px;letter-spacing:3px;color:var(--cy);text-shadow:0 0 8px var(--cy)}
.sub{font-size:10px;opacity:.6;letter-spacing:1px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr);margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:10px;position:relative}
.panel::before{content:attr(data-t);position:absolute;top:-7px;left:10px;background:var(--bg);padding:0 6px;font-size:9px;letter-spacing:2px;color:var(--cy)}
#status{text-align:center;padding:14px 8px}
#state{font-size:26px;letter-spacing:5px;font-weight:700;transition:color .3s,text-shadow .3s}
#bar{height:6px;background:#031017;border:1px solid var(--line);margin-top:10px;overflow:hidden}
#fill{height:100%;width:5%;background:linear-gradient(90deg,var(--gr),var(--am),var(--rd));transition:width .3s}
.row{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;opacity:.8}
canvas{width:100%;height:190px;display:block;background:#020a0f;border:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:10px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{border:1px solid var(--line);padding:8px;background:#04101600}
.cell b{display:block;font-size:9px;letter-spacing:1px;opacity:.65;font-weight:400}
.cell span{font-size:17px;color:var(--cy);text-shadow:0 0 6px rgba(0,240,255,.5);font-variant-numeric:tabular-nums}
.cell small{font-size:10px;opacity:.6;margin-left:3px}
.cell.hot span{color:var(--mg);text-shadow:0 0 6px var(--mg)}
.mini{height:22px;margin-top:4px}
.btns{display:flex;gap:6px}
button{flex:1;background:#031017;color:var(--tx);border:1px solid var(--line);padding:11px 4px;font:inherit;letter-spacing:2px;font-size:11px;border-radius:3px;cursor:pointer;touch-action:manipulation}
button.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 10px rgba(0,240,255,.35) inset}
#log{height:150px;overflow:hidden;font-size:11px;line-height:1.55}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
.ok{color:var(--gr)}.wr{color:var(--am)}.bd{color:var(--rd)}.mg{color:var(--mg)}
.loc{font-size:11px;line-height:1.7}
button.act{border-color:#ff2bd6;color:#ff2bd6}
button.yl{border-color:#ffb800;color:#ffb800;box-shadow:0 0 10px rgba(255,184,0,.25) inset}
button.go{border-color:#39ff88;color:#39ff88}
.btns.col{flex-direction:column}
#tix{margin-top:8px;font-size:11px}
#tix div{border:1px solid var(--line);padding:6px 8px;margin-top:5px;display:flex;justify-content:space-between;gap:8px}
#tix .st{color:var(--am);white-space:nowrap}
#tix .st.rv{color:var(--gr)}
.tk{color:var(--cy)}
#status.alert{border-color:var(--rd);animation:al .7s infinite}
@keyframes al{50%{box-shadow:0 0 22px var(--rd),inset 0 0 18px rgba(255,51,85,.25)}}
#tinfo{margin-top:8px;font-size:11px;min-height:15px;color:var(--rd)}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}canvas{height:240px}}
</style>
</head>
<body>
<header>
  <div><h1>WAVE//SHIELD</h1><div class="sub">ATMOSPHERIC INTERCEPT MONITOR v4.2</div></div>
  <div class="sub"><span class="dot"></span><span id="clock">--:--:--</span></div>
</header>

<div class="panel" id="status" data-t="THREAT STATE">
  <div id="state">STABLE</div>
  <div id="tinfo"></div>
  <div id="bar"><div id="fill"></div></div>
  <div class="row"><span>SIGNATURE DRIFT <b id="drift">0.0%</b></span><span>SCANNERS <b id="scn">0</b></span></div>
</div>

<div class="panel" data-t="MODE">
  <div class="btns">
    <button id="mAuto" class="on">AUTO</button>
    <button id="mStill">STATIONARY</button>
    <button id="mMove">MOVING</button>
  </div>
  <div id="warn" style="display:none;margin-top:8px;padding:8px;border:1px solid var(--am);color:var(--am);font-size:11px;line-height:1.5"></div>
  <div class="row"><span id="src">SENSOR: ACQUIRING…</span><span id="mv">MOTION 0.00</span></div>
</div>

<div class="panel" data-t="WAVE SCOPE">
  <canvas id="scope"></canvas>
  <div class="legend">
    <span><i style="background:var(--cy)"></i>INCOMING SCAN</span>
    <span><i style="background:var(--mg)"></i>YOUR DISTORTION FIELD</span>
    <span><i style="background:var(--gr)"></i>REROUTED</span>
  </div>
</div>

<div class="panel" data-t="BAND READINGS">
  <div class="grid" id="bands"></div>
</div>

<div class="panel" data-t="LOCATION FINGERPRINT">
  <div class="loc">
    ZONE ID &nbsp;&nbsp;<span id="zone" class="ok">----</span><br>
    GRID &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span id="grid">--.---- / --.----</span><br>
    REDIRECT → <span id="redir" class="mg">---</span><br>
    EMISSION &nbsp;<span id="emis">MASKED</span>
  </div>
</div>

<div class="panel" data-t="RESOLVE">
  <div class="btns col">
    <button id="bConf" class="act">RESOLVE CONFLICT</button>
    <button id="bTix" class="yl">OPEN TICKET → TEAM LEAD</button>
    <button id="bScan" class="act">RESOLVE SCANNER</button>
    <button id="bQuiet" class="go">GO QUIET</button>
  </div>
  <div id="tix"></div>
</div>

<div class="panel" data-t="INTERCEPT LOG">
  <div id="log"></div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- movement intensity (0 still .. 1 wild) ---------- */
let mode='auto', sensorMove=0, intensity=0.03, motionI=0.03, lastAcc=null, accEnergy=0, geoSpeed=0, srcTxt='NO SENSOR · USE MANUAL';
let hasSensor=false;

function setMode(m){mode=m;['Auto','Still','Move'].forEach(n=>$('m'+n).classList.toggle('on',n.toLowerCase()===m));}
$('mAuto').onclick=()=>{setMode('auto');askMotion()};
$('mStill').onclick=()=>setMode('still');
$('mMove').onclick=()=>setMode('move');

let motionEvents=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity||e.acceleration;
  const r=e.rotationRate;
  let d=0;
  if(a&&a.x!=null){
    const m=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
    if(lastAcc!==null)d+=Math.abs(m-lastAcc);
    lastAcc=m;
  }
  if(r)d+=(Math.abs(r.alpha||0)+Math.abs(r.beta||0)+Math.abs(r.gamma||0))/90;
  accEnergy=accEnergy*0.9+d*1.2;
  motionEvents++;hasSensor=true;
}
function askMotion(){
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')window.addEventListener('devicemotion',onMotion)}).catch(()=>{});
    }else window.addEventListener('devicemotion',onMotion);
  }catch(e){}
}
window.addEventListener('deviceorientation',function(e){
  const g=[e.alpha||0,e.beta||0,e.gamma||0];
  if(window._o){const d=Math.abs(g[0]-_o[0])%180+Math.abs(g[1]-_o[1])+Math.abs(g[2]-_o[2]);accEnergy=Math.max(accEnergy,Math.min(d/25,3))}
  window._o=g;
});
askMotion();
document.addEventListener('click',function(){askMotion();try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission()}catch(e){}},{once:true});

/* ---------- location fingerprint ---------- */
let lat=null,lng=null,zoneSeed=0.5,lastPos=null;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)}
function applyZone(la,lo){
  lat=la;lng=lo;
  const key=la.toFixed(3)+','+lo.toFixed(3); // ~100m cells
  const h=hash(key); zoneSeed=(h%10000)/10000;
  $('zone').textContent='Z-'+h.toString(16).toUpperCase().slice(0,6);
  $('grid').textContent=la.toFixed(4)+' / '+lo.toFixed(4);
  log('ZONE SHIFT → Z-'+h.toString(16).toUpperCase().slice(0,6)+' · BASELINE RECALIBRATED','wr');
}
if(navigator.geolocation){
  navigator.geolocation.watchPosition(p=>{
    const la=p.coords.latitude,lo=p.coords.longitude;
    if(p.coords.speed!=null)geoSpeed=p.coords.speed;
    if(lastPos){const d=Math.hypot(la-lastPos[0],lo-lastPos[1])*111000;geoSpeed=Math.max(geoSpeed,d/2)}
    lastPos=[la,lo];
    if(lat===null||Math.abs(la-lat)>0.0005||Math.abs(lo-lng)>0.0005)applyZone(la,lo);
    hasSensor=true;
  },()=>{},{enableHighAccuracy:true,maximumAge:1000});
}
if(lat===null){zoneSeed=0.42;$('zone').textContent='Z-LOCAL';}

/* ---------- bands ---------- */
const BANDS=[
 {n:'WI-FI',u:'GHz',base:2.4,sp:.06,fmt:2},
 {n:'CELLULAR',u:'MHz',base:1850,sp:90,fmt:0},
 {n:'BLUETOOTH',u:'GHz',base:2.44,sp:.04,fmt:2},
 {n:'RADIO / RF',u:'MHz',base:433,sp:40,fmt:1},
 {n:'GPS L1',u:'MHz',base:1575.4,sp:12,fmt:1},
 {n:'SIGNAL STRENGTH',u:'dBm',base:-62,sp:14,fmt:0},
 {n:'AMPLITUDE',u:'mV',base:38,sp:30,fmt:1},
 {n:'PHASE ERROR',u:'°',base:3,sp:50,fmt:1},
 {n:'NOISE FLOOR',u:'dB',base:-94,sp:10,fmt:1}
];
const bandsEl=$('bands');
BANDS.forEach((b,i)=>{
  const d=document.createElement('div');d.className='cell';
  d.innerHTML='<b>'+b.n+'</b><span id="bv'+i+'">0</span><small>'+b.u+'</small><canvas class="mini" id="bm'+i+'" style="height:22px;border:0;background:none"></canvas>';
  bandsEl.appendChild(d);b.hist=new Array(40).fill(0.5);b.val=b.base;
});

/* ---------- scope ---------- */
const cv=$('scope'),cx=cv.getContext('2d');let W,H,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  BANDS.forEach((b,i)=>{const c=$('bm'+i);const rr=c.getBoundingClientRect();c.width=rr.width*dpr;c.height=rr.height*dpr;});}
window.addEventListener('resize',resize);resize();

function wave(color,amp,freq,phase,chaos,yoff,alpha,lw){
  cx.beginPath();
  for(let x=0;x<=W;x+=2){
    const t=x/W;
    let y=Math.sin(t*freq*Math.PI*2+phase)*amp
        +Math.sin(t*freq*2.7*Math.PI*2+phase*1.9)*amp*0.35*chaos
        +(Math.random()-.5)*amp*0.9*chaos
        +Math.sin(t*freq*7.3*Math.PI*2+phase*3.1)*amp*0.25*chaos;
    x?cx.lineTo(x,H*yoff+y):cx.moveTo(x,H*yoff+y);
  }
  cx.globalAlpha=alpha;cx.strokeStyle=color;cx.lineWidth=lw;cx.shadowColor=color;cx.shadowBlur=8;cx.stroke();cx.globalAlpha=1;cx.shadowBlur=0;
}
let ph=0,pulses=[],nextPulse=0;
function drawPulses(ts){
  if(ts>nextPulse){pulses.push({x:rnd(.1,.9)*W,t:0});nextPulse=ts+(2600-intensity*2200)+rnd(0,600)}
  pulses=pulses.filter(p=>p.t<1);
  pulses.forEach(p=>{
    p.t+=0.025+intensity*0.02;
    const y0=H*.22,y1=H*.5,y2=H*.78;
    if(p.t<.5){ // cyan scan travels down to your field
      const y=y0+(y1-y0)*(p.t/.5);
      cx.fillStyle='#00f0ff';cx.shadowColor='#00f0ff';cx.shadowBlur=14;cx.fillRect(p.x-1,y0,2,y-y0);cx.shadowBlur=0;
    }else{
      const k=(p.t-.5)/.5; // impact flash, then green piece goes out the bottom
      cx.strokeStyle='rgba(255,43,214,'+(1-k)+')';cx.lineWidth=2;cx.beginPath();cx.arc(p.x,y1,6+k*34,0,7);cx.stroke();
      const gy=y1+(y2-y1)*k+(Math.random()-.5)*10*intensity*5;
      cx.fillStyle='rgba(57,255,136,'+(1-k*.6)+')';cx.fillRect(p.x+(Math.random()-.5)*intensity*40,gy,3,3+k*6);
      if(!p.hit){p.hit=1;if(Math.random()<.6)log('SCAN INTERCEPTED · DISTORTED · REROUTED','mg')}
    }
  });
}
function drawScope(){
  cx.clearRect(0,0,W,H);
  cx.strokeStyle='rgba(0,240,255,.08)';cx.lineWidth=1;
  for(let i=1;i<10;i++){cx.beginPath();cx.moveTo(W*i/10,0);cx.lineTo(W*i/10,H);cx.stroke()}
  for(let i=1;i<6;i++){cx.beginPath();cx.moveTo(0,H*i/6);cx.lineTo(W,H*i/6);cx.stroke()}
  const I=intensity;
  ph+=0.05+I*0.5;
  // incoming scan (clean, from the outside)
  wave('#00f0ff',H*0.11,3+zoneSeed*2,ph,0.02,0.22,.95,1.6);
  // your distortion field: calm when still, violent when moving
  wave('#ff2bd6',H*(0.07+I*0.20),4+zoneSeed*3+I*9,-ph*(1+I*2),0.1+I*1.6,0.5,.95,1.6+I);
  // rerouted output: scanner wave smeared & pushed elsewhere
  wave('#39ff88',H*(0.05+I*0.14),2+I*6,ph*0.6+3,0.3+I*1.2,0.78,.8,1.3);
  drawPulses(performance.now());
  // sweep line
  const sx=(performance.now()/6)%W;cx.fillStyle='rgba(0,240,255,.12)';cx.fillRect(sx,0,2,H);
}
function drawMini(){
  BANDS.forEach((b,i)=>{
    const c=$('bm'+i),g=c.getContext('2d'),w=c.width,h=c.height;
    g.clearRect(0,0,w,h);g.beginPath();
    b.hist.forEach((v,k)=>{const x=k/(b.hist.length-1)*w,y=h-v*h;k?g.lineTo(x,y):g.moveTo(x,y)});
    g.strokeStyle=intensity>.45?'#ff2bd6':'#00f0ff';g.lineWidth=1.5*dpr;g.stroke();
  });
}

/* ---------- readings update ---------- */
function updateReadings(){
  const I=intensity;
  BANDS.forEach((b,i)=>{
    const zoneShift=(zoneSeed-.5)*b.sp*0.9;                     // each place has its own baseline
    const calm=(Math.random()-.5)*b.sp*0.012;                    // tiny wobble when still
    const wild=(Math.random()-.5)*b.sp*2.2*I+(Math.random()-.5)*b.sp*1.2*I*I; // big swings when moving
    const target=b.base+zoneShift+calm+wild;
    b.val+= (target-b.val)*(0.5+I*0.5);
    const el=$('bv'+i);el.textContent=b.val.toFixed(b.fmt);
    el.parentElement.classList.toggle('hot',I>.45);
    b.hist.push(clamp(.5+(b.val-b.base)/(b.sp*2.4),0.04,0.96));b.hist.shift();
  });
  $('fill').style.width=(5+I*95)+'%';
  $('drift').textContent=(0.2+I*37+Math.random()*I*8).toFixed(1)+'%';
  $('scn').textContent=Math.round(1+zoneSeed*3+I*14*Math.random()+I*4);
  if(quiet||Date.now()<scanClear)$('scn').textContent=0;
  const s=$('state'),st=$('status');
  const set=(t,c,e,ec)=>{s.textContent=t;s.style.color=c;s.style.textShadow='0 0 12px '+c;$('emis').textContent=e;$('emis').className=ec};
  st.classList.toggle('alert',phase==='threat'&&!quiet);
  if(quiet)set('QUIET','#00f0ff','SILENT · NO EMISSION','ok');
  else if(phase==='threat'){set('THREAT DETECTED','#ff3355','COMPROMISED · ACTION NEEDED','bd');$('fill').style.width='100%';$('drift').textContent=(62+Math.random()*30).toFixed(1)+'%';$('scn').textContent=3+Math.floor(Math.random()*3)}
  else if(phase==='resolving')set('RESOLVING'+'.'.repeat(1+Math.floor(Date.now()/350)%3),'#ffb800','NEUTRALISING THREAT','wr');
  else if(phase==='scrambling')set('SCRAMBLING'+'.'.repeat(1+Math.floor(Date.now()/350)%3),'#ff2bd6','MAX DISTORTION · REROUTING','bd');
  else set('STABLE','#39ff88',motionI>.3?'DISTORTION HOLDING · LOCKED':'MASKED · LOW PROFILE','ok');
}

/* ---------- log ---------- */
const logEl=$('log');
function log(t,c){const d=document.createElement('div');d.className=c||'';
  const n=new Date();d.textContent='['+n.toTimeString().slice(0,8)+'] '+t;
  logEl.prepend(d);while(logEl.children.length>9)logEl.lastChild.remove();}
const NODES=['NODE-7F2 · UNKNOWN','RELAY-ALPHA · 41.2°N','SINK-0x9C · VOID','PROXY-KAPPA · OFFSHORE','DEAD-DROP-13 · NULL','NODE-3B8 · DECOY'];
const STILL_MSG=[['PASSIVE SCAN DETECTED · DEFLECTED','ok'],['SIGNATURE MATCH FAILED','ok'],['HANDSHAKE PROBE IGNORED','ok'],['ENVIRONMENT HASH HELD STEADY','ok']];
const MOVE_MSG=[['SCAN LOCK BROKEN · RETARGETING','bd'],['PHASE INVERTED · TRACE SMEARED','mg'],['TRIANGULATION FAILED','bd'],['WAVEFRONT REDIRECTED','mg'],['DECOY SIGNATURE INJECTED','wr'],['FREQUENCY HOP · +'+0+' CH','wr']];
let logT=0;
function logTick(){
  const m=intensity>.3?MOVE_MSG:STILL_MSG;const p=m[Math.floor(Math.random()*m.length)];
  log(p[0].replace('+0','+'+Math.floor(rnd(2,40))),p[1]);
}
function redirTick(){$('redir').textContent=NODES[Math.floor(Math.random()*NODES.length)]}

/* ---------- resolve / tickets ---------- */
let quiet=false,tkN=4800+Math.floor(Math.random()*100);
function openTicket(kind,after){
  const id='TKT-'+(++tkN);
  const row=document.createElement('div');
  row.innerHTML='<span class="tk">'+id+' · '+kind+'</span><span class="st">OPEN → TEAM LEAD</span>';
  const t=$('tix');t.prepend(row);while(t.children.length>3)t.lastChild.remove();
  log('TICKET '+id+' OPENED · '+kind,'wr');
  setTimeout(()=>log('TICKET OPENED TO TEAM LEAD · WILL RESOLVE SHORTLY','ok'),500);
  setTimeout(()=>{const st=row.querySelector('.st');st.textContent='IN REVIEW';},4000);
  setTimeout(()=>{const st=row.querySelector('.st');st.textContent='RESOLVED';st.classList.add('rv');log(id+' RESOLVED BY TEAM LEAD','ok');if(after)after()},11000);
}
let lastMoveTs=0,scanClear=0,phase='stable',phaseT=0,nextSwitch=3000,lastThreat='GENERAL';

/* Alternates STABLE <-> SCRAMBLING forever. No threats are ever raised. */
function stateTick(ts){
  if(quiet)return;
  if(phase==='scrambling'){
    if(ts>phaseT){
      phase='stable';
      nextSwitch=ts+rnd(4000,7000);
      log('FIELD SETTLED · STABLE','ok');
    }
  }else if(phase==='stable'){
    if(ts>nextSwitch){
      phase='scrambling';
      phaseT=ts+rnd(4000,6000);
      log('SCRAMBLING · DISTORTION FIELD ENGAGED','mg');
    }
  }else{
    // safety: any other phase falls back to stable
    phase='stable';
    nextSwitch=ts+rnd(3000,5000);
  }
}
$('bConf').onclick=()=>{
  log('NO ACTIVE THREAT · NOTHING TO RESOLVE','ok');
};
$('bTix').onclick=()=>openTicket(lastThreat);
$('bScan').onclick=()=>{log('RESOLVE SCANNER · DROPPING TRACE…','wr');scanClear=Date.now()+10000;setTimeout(()=>log('SCANNERS CLEARED','ok'),1200)};
$('bQuiet').onclick=()=>{
  quiet=!quiet;
  $('bQuiet').textContent=quiet?'RESUME SHIELD':'GO QUIET';
  log(quiet?'GOING QUIET · EMISSIONS SUPPRESSED':'SHIELD RESUMED',quiet?'ok':'wr');
  if(!quiet){phase='stable';nextSwitch=performance.now()+rnd(3000,5000);$('tinfo').textContent=''}
};

/* ---------- main loop ---------- */
let last=0,tReads=0,tLog=0,tRedir=0;
function loop(ts){
  const dt=ts-last;last=ts;
  // compute target intensity
  let target;
  if(mode==='still')target=0.03;
  else if(mode==='move')target=0.85+Math.sin(ts/700)*0.12;
  else target=clamp(accEnergy/1.5+geoSpeed/1.2,0.03,1);
  if(quiet)target=0.01;
  accEnergy*=0.985; geoSpeed*=0.995;
  motionI+=(target-motionI)*Math.min(1,dt/350);
  stateTick(ts);
  let vt;
  if(quiet)vt=0.01;
  else if(phase==='scrambling')vt=Math.max(motionI,0.75);
  else vt=0.05;
  intensity+=(vt-intensity)*Math.min(1,dt/700);
  $('mv').textContent='MOTION '+motionI.toFixed(2);
  $('src').textContent=mode==='auto'?(motionEvents>0?'SENSOR: LIVE ('+motionEvents+')':'NO SENSOR DATA · USE MANUAL'):'MANUAL OVERRIDE';
  const w=$('warn');
  if(mode==='auto'&&motionEvents===0&&ts>4000){
    w.style.display='block';
    w.innerHTML='NO MOTION DATA. Your phone/browser is blocking motion sensors (common when a file is opened from Files or a preview, or without https). Host it on https (e.g. Vercel) and allow motion access when asked, or use MOVING.';
  }else w.style.display='none';
  tReads+=dt;tLog+=dt;tRedir+=dt;
  if(tReads>(intensity>.3?70:300)){tReads=0;updateReadings();drawMini()}
  if(tLog>(intensity>.3?650:1800)){tLog=0;logTick()}
  if(tRedir>(intensity>.3?500:3500)){tRedir=0;redirTick()}
  drawScope();
  requestAnimationFrame(loop);
}
setInterval(()=>{$('clock').textContent=new Date().toTimeString().slice(0,8)},1000);
redirTick();updateReadings();log('SHIELD ONLINE · MONITORING','ok');
requestAnimationFrame(loop);
})();
</script>
